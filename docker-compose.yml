# hostmon — 以「宿主机视角」采集指标的最小权限 compose 配置
#
# 首次启动：
#   bash build.sh                                  # 生成 dist/ 下两个静态二进制
#   echo 'HOSTMON_WEB_TOKEN=换成强随机串' > .env    # .env 已在 .gitignore 中
#   docker compose up -d --build
#   curl -H 'Authorization: Bearer 换成强随机串' http://127.0.0.1:9100/api/v1/metrics
#
# x86_64 服务器：在 .env 里加 HOSTMON_BIN=dist/hostmon-linux-amd64
services:
  hostmon:
    build:
      context: .
      args:
        HOSTMON_BIN: ${HOSTMON_BIN:-dist/hostmon-linux-arm64}
    image: hostmon:local
    container_name: hostmon
    restart: unless-stopped

    # host network 让 /host/proc/net/* 解析到宿主机 netns；
    # 同时 -web 绑 127.0.0.1 就等价于绑在宿主机回环，无需 ports 映射、不对外暴露。
    network_mode: host

    # ---- 最小权限：只读、非 root、无 capability、禁止提权 ----
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

    volumes:
      # 必需：CPU / 内存 / 负载 / 运行时间 / 磁盘 IO / 网络 / TCP / 挂载表
      - /proc:/host/proc:ro
      # 推荐：让 statfs(2) 能看到宿主机根分区，并读取宿主机 os-release / hostname
      # rslave 让宿主机后续挂载/卸载事件传播进容器
      - /:/host:ro,rslave
      # 让容器内时间显示与宿主机一致（scratch 镜像不带 tzdata）
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro

    environment:
      TZ: Asia/Shanghai
      HOSTMON_WEB_TOKEN: ${HOSTMON_WEB_TOKEN:?请在 .env 中设置 HOSTMON_WEB_TOKEN}

    command:
      - -interval
      - 5s
      - -web
      - 127.0.0.1:9100
      - -proc-root
      - /host/proc
      - -host-root
      - /host
      - -quiet

    # 如需 JSONL 落盘，在 command 里追加 "-log" "/tmp/hostmon.jsonl" 并启用：
    # tmpfs:
    #   - /tmp:size=64m,uid=65532,gid=65532
    # 需要长期保留则改为绑定宿主机目录（确保 uid 65532 可写），并去掉 read_only 或给该目录可写。
    #
    # 健康检查由外部探针访问 /healthz（该端点不鉴权）；scratch 镜像内没有 curl/wget。
